name: Release to Feishu
run-name: Feishu ${{ github.event.inputs.mode || 'release' }} · ${{ github.event.inputs.tag || github.event.release.tag_name }}
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag, e.g. v2.3.0'
        required: true
        type: string
      mode:
        description: 'test sends a labeled test; backfill sends release information'
        required: true
        default: test
        type: choice
        options: [test, backfill]
permissions:
  contents: read
concurrency:
  group: feishu-${{ github.event.inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test notification code without credentials
        run: python3 -m unittest discover -s tests -v
      - name: Send signed release notification
        env:
          GH_TOKEN: ${{ github.token }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
        run: python3 scripts/notify_feishu.py
